name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Organizar arquivos e criar a parte Android
        run: |
          # se o main.dart foi enviado solto, coloca na pasta lib
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
          flutter create --org com.deividi --project-name protocolos --platforms android .
          rm -rf test
          # nome do app no celular
          sed -i 's/android:label="protocolos"/android:label="Meus Protocolos"/' android/app/src/main/AndroidManifest.xml
          # versão mínima do Android exigida pelo leitor de texto
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
          cp proguard-rules.pro android/app/proguard-rules.pro

      - name: Receber prints pelo menu Compartilhar
        run: |
          if [ -f MainActivity.kt ]; then
            find android/app/src/main -name 'MainActivity.*' -delete
            mkdir -p android/app/src/main/kotlin/com/deividi/protocolos
            cp MainActivity.kt android/app/src/main/kotlin/com/deividi/protocolos/MainActivity.kt
            python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
          filtros = '''
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="image/*"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="image/*"/>
                      </intent-filter>
                  </activity>'''
          s = s.replace('</activity>', filtros, 1)
          open(p, 'w').write(s)
          EOF
          fi

      - name: Usar sempre a mesma assinatura (para atualizar sem desinstalar)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MeusProtocolos-APK
          path: build/app/outputs/flutter-apk/app-release.apk
